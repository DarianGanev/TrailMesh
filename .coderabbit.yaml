# CodeRabbit configuration for TrailMesh.
# CodeRabbit is enabled for this public repository.

language: en-US

tone_instructions: >
  Review as a mobile networking engineer. Prioritize security, privacy, protocol
  compatibility, lifecycle assumptions, resource limits, tests, and honest
  background-connectivity claims. Avoid emergency-safety claims.

reviews:
  profile: chill
  auto_review:
    enabled: true
    drafts: true
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  sequence_diagrams: false
  path_instructions:
    - path: "protocol/**"
      instructions: |
        Treat wire formats, canonicalization, IDs, signatures, replay handling,
        and version compatibility as security-sensitive. Require fixtures and
        reject ambiguous parsing.
    - path: "apps/**"
      instructions: |
        Check platform lifecycle behavior, permissions, cancellation, durable ACK
        semantics, diagnostics redaction, and cross-platform parity.
    - path: "experiments/foreground_exchange/**"
      instructions: |
        Check session/link callback generations, foreground service ownership,
        ActivityKit availability and finite background fallback, retry bounds,
        atomic checkpoint/evidence writes, duplicate-safe bidirectional progress,
        and Kotlin/Swift probe-v2 parity. Keep physical radio claims unverified
        unless supported by recorded device evidence; automatic SDK acceptance
        authenticates no peer and carries generated test bytes only.
    - path: "simulator/**"
      instructions: |
        Check determinism, fair comparisons, seed/config capture, and separation
        between oracle knowledge and information available to real nodes.

chat:
  art: false
