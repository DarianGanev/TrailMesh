name: Isolated iPhone routing SDK
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test opaque C boundary
        run: python -m unittest discover -s tools/maps -p test_ios_router_bridge.py
      - name: Build and verify isolated engine
        run: bash tools/maps/build_ios_router.sh "$RUNNER_TEMP/ios-router"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrailMesh-iOS-routing-sdk
          path: |
            apps/ios/NativeRouting/Artifacts/TrailMeshValhalla.xcframework.zip
            apps/ios/NativeRouting/Artifacts/TrailMeshValhalla.xcframework.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrailMesh-iOS-routing-sdk-evidence
          path: |
            ${{ runner.temp }}/ios-router/TrailMeshValhalla.xcframework.zip
            ${{ runner.temp }}/ios-router/TrailMeshValhalla.xcframework.zip.sha256
            apps/ios/NativeRouting/Artifacts/Evidence/
          if-no-files-found: error
          retention-days: 14
