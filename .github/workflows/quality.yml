name: Quality

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  map-region-build:
    name: Prepare real offline Rila data
    needs: change-detection
    if: needs.change-detection.outputs.android == 'true' || needs.change-detection.outputs.ios == 'true'
    uses: ./.github/workflows/map-region.yml

  ios-routing-build:
    name: Prepare isolated iPhone routing SDK
    needs: change-detection
    if: needs.change-detection.outputs.ios == 'true'
    uses: ./.github/workflows/ios-router.yml

  change-detection:
    name: Change detection
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify platform-relevant changes
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed_paths="apps/__run_all__"
          else
            changed_paths="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          fi

          android=false
          ios=false
          if grep -Eq '^(\.github/workflows/(quality|map-region|ios-router)\.yml|apps/|probes/transport/android/|protocol/|tools/protocol/|tools/transport/|tools/maps/|tools/ci/)' <<< "$changed_paths"; then
            android=true
          fi
          if grep -Eq '^(\.github/workflows/(quality|map-region|ios-router)\.yml|apps/|probes/transport/ios/|protocol/|tools/protocol/|tools/transport/|tools/maps/)' <<< "$changed_paths"; then
            ios=true
          fi

          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "Android checks: $android"
          echo "iOS checks: $ios"

  protocol-contracts:
    name: Protocol and transport contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install protocol and map tooling
        run: python -m pip install --disable-pip-version-check --requirement tools/protocol/requirements.txt --requirement tools/maps/requirements.txt
      - name: Validate fixture JSON
        run: python -m json.tool protocol/fixture-v1.json >/dev/null
      - name: Validate frozen fixture contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, '.')
          from tools.protocol.vector import parse_json_strict

          fixture = parse_json_strict(Path('protocol/fixture-v1.json').read_text(encoding='utf-8'))
          required = {
              'fixtureVersion', 'status', 'purpose', 'coreDomain', 'idDomain',
              'core', 'canonicalCore', 'canonicalCoreSha256', 'bundleId',
              'publicKey', 'signature',
          }
          missing = required.difference(fixture)
          if missing:
              raise SystemExit(f'missing fixture fields: {sorted(missing)}')
          if fixture['fixtureVersion'] != 1:
              raise SystemExit('fixtureVersion must be 1')
          if fixture['status'] != 'frozen':
              raise SystemExit('fixtureVersion 1 must remain explicitly frozen after Issue #1')
          PY
      - name: Run protocol admission and vector tests
        run: python -m unittest discover -s tools/protocol -p 'test_*.py'
      - name: Validate offline region contracts
        run: python -m unittest discover -s tools/maps -p 'test_*.py'
      - name: Validate CI recovery helpers
        run: python -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Run bounded exchange contract tests
        run: python -m unittest discover -s tools/transport -p 'test_*.py'

  android-probe:
    name: Android transport probe
    needs: change-detection
    if: needs.change-detection.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: probes/transport/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Run Android unit tests and build the probe
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Upload Android test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrailMeshTransportProbe-android-debug
          path: probes/transport/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-product:
    name: Android product repository
    needs: change-detection
    if: needs.change-detection.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Verify shared vectors and pre-release schema fixtures exist
        run: |
          test -s ../../protocol/report-v1-vectors.json
          test -s ../../protocol/exchange-v1-vectors.json
          test -s ../../protocol/relevance-v1-vectors.json
          for version in 1 2 3 4 5; do
            test -s "app/schemas/org.trailmesh.app.persistence.ReportDatabase/$version.json"
          done
      - name: Test repository and build product and instrumentation APKs
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Require passing tests and unchanged Room schema exports
        run: |
          python ../../tools/ci/check_junit.py app/build/test-results/testDebugUnitTest
          git diff --exit-code -- app/schemas
          test -z "$(git status --porcelain -- app/schemas)"
      - name: Independently validate Android-authored signed report
        run: |
          python -m pip install --disable-pip-version-check -r ../../tools/protocol/requirements.txt
          PYTHONPATH=../.. python -c 'from pathlib import Path; from tools.protocol.report import validate_report, ValidatedReport; result=validate_report(Path("app/build/interop/android-authored.json").read_bytes(), now_ms=1789647000000); assert isinstance(result, ValidatedReport), result'
          PYTHONPATH=../.. python -m tools.transport.report_exchange --verify-native app/build/interop/android-exchange-frames.json
      - name: Upload Android product artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrailMeshProduct-android-debug
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            apps/android/app/build/test-results/testDebugUnitTest/
            apps/android/app/build/interop/android-authored.json
            apps/android/app/build/interop/android-exchange-frames.json
          if-no-files-found: error
          retention-days: 7

  android-product-devices:
    name: Android product API ${{ matrix.api }}
    needs: [change-detection, android-product, map-region-build]
    if: needs.change-detection.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Oreo x86_64 emulator's SwiftShader path aborts in snapshots.
          # Retain minimum-version install, search, route, and restart checks.
          - api: 26
            render_map: false
          - api: '37.0'
            render_map: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Download verified regional test resources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TrailMesh-Rila-region
          path: ${{ runner.temp }}/Rila
      - name: Build the APKs before booting the emulator
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Android SDK tools supporting Android 17
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902' # Command-line Tools 22.0
          log-accepted-android-sdk-licenses: false
      - name: Expose pinned tools to the emulator action
        run: |
          pinned_tools="$ANDROID_HOME/cmdline-tools/22.0"
          runner_latest="$ANDROID_HOME/cmdline-tools/latest"
          test -x "$pinned_tools/bin/avdmanager"
          if [[ -e "$runner_latest" || -L "$runner_latest" ]]; then
            mv "$runner_latest" "$RUNNER_TEMP/android-preinstalled-cmdline-tools"
          fi
          ln -s "$pinned_tools" "$runner_latest"
          grep -F 'Pkg.Revision=22.0' "$runner_latest/source.properties"
      - name: Run real Android SQLite, migration, crypto, Keystore and restart tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          ram-size: 2048M
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          pre-emulator-launch-script: |
            grep -Fx 'target=android-${{ matrix.api }}' "$HOME/.android/avd/test.ini"
          script: |
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "$(printf '%s' '${{ matrix.api }}' | cut -d . -f 1)"
            adb shell mkdir -p /data/local/tmp/trailmesh-map-pack
            adb push "$RUNNER_TEMP/Rila/pack/." /data/local/tmp/trailmesh-map-pack/
            adb push "$RUNNER_TEMP/Rila/smoke.json" /data/local/tmp/trailmesh-map-pack/smoke.json
            adb shell getprop ro.kernel.qemu.opengles.version
            bash tools/ci/prepare_android_offline.sh '${{ matrix.api }}'
            cd apps/android && ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.trailmeshMapPack=/data/local/tmp/trailmesh-map-pack -Pandroid.testInstrumentationRunnerArguments.trailmeshRequireMapPack=true -Pandroid.testInstrumentationRunnerArguments.trailmeshMapRender=${{ matrix.render_map }} -Pandroid.testInstrumentationRunnerArguments.trailmeshManifestSha256="$(cat "$RUNNER_TEMP/Rila/manifest.sha256")"
            python tools/ci/check_junit.py apps/android/app/build/outputs/androidTest-results/connected
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb install -t -r apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class org.trailmesh.app.persistence.ProcessRestartInstrumentedTest -e phase store org.trailmesh.app.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/process-store.txt"
            cat "$RUNNER_TEMP/process-store.txt" && grep -Eq 'OK \(1 test\)' "$RUNNER_TEMP/process-store.txt"
            adb shell am force-stop org.trailmesh.app
            adb shell am instrument -w -r -e class org.trailmesh.app.persistence.ProcessRestartInstrumentedTest -e phase verify org.trailmesh.app.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/process-restart.txt"
            cat "$RUNNER_TEMP/process-restart.txt" && grep -Eq 'OK \(1 test\)' "$RUNNER_TEMP/process-restart.txt"
            adb shell am force-stop org.trailmesh.app
            adb shell am instrument -w -r -e class org.trailmesh.app.maps.OfflineRegionSmokeTest -e trailmeshMapPack /data/local/tmp/trailmesh-map-pack -e trailmeshRequireMapPack true -e trailmeshMapPhase verify -e trailmeshMapRender '${{ matrix.render_map }}' -e trailmeshManifestSha256 "$(cat "$RUNNER_TEMP/Rila/manifest.sha256")" org.trailmesh.app.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/map-restart.txt"
            cat "$RUNNER_TEMP/map-restart.txt" && grep -Eq 'OK \(1 test\)' "$RUNNER_TEMP/map-restart.txt"
            if [ '${{ matrix.render_map }}' = true ]; then adb exec-out run-as org.trailmesh.app cat files/offline-smoke-snapshot.png > "$RUNNER_TEMP/offline-map-api-${{ matrix.api }}.png"; fi
            adb exec-out run-as org.trailmesh.app cat files/offline-smoke-evidence.json > "$RUNNER_TEMP/offline-map-api-${{ matrix.api }}.json"
      - name: Upload device test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrailMeshProduct-android-api-${{ matrix.api }}-results
          path: |
            apps/android/app/build/outputs/androidTest-results/
            apps/android/app/build/reports/androidTests/
            ${{ runner.temp }}/offline-map-api-*
            ${{ runner.temp }}/android-network-preparation.log
            ${{ runner.temp }}/process-restart.txt
            ${{ runner.temp }}/process-store.txt
          if-no-files-found: error
          retention-days: 7

  ios-probe:
    name: iOS transport probe
    needs: change-detection
    if: needs.change-detection.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: probes/transport/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; matches=sorted(((runtime, device["name"], device["udid"]) for runtime, entries in devices.items() if "iOS" in runtime for device in entries if device["name"] == "iPhone 16"), reverse=True); print(matches[0][2] if matches else "")')"
          if [[ -z "$simulator_id" ]]; then
            echo "No available iPhone 16 simulator found" >&2
            exit 1
          fi
          xcrun simctl list devices available | grep -F "$simulator_id"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Run iOS frame and session tests
        run: >-
          xcodebuild test
          -project TrailMeshTransportProbe.xcodeproj
          -scheme TrailMeshTransportProbe
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}"
          -derivedDataPath "$RUNNER_TEMP/TrailMeshDerivedData"
          ARCHS=arm64
          CODE_SIGNING_ALLOWED=NO

  ios-device-package:
    name: Unsigned iPhone probe package
    needs: change-detection
    if: needs.change-detection.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: probes/transport/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build for a physical iPhone without repository signing secrets
        shell: bash
        run: |
          xcodebuild build \
            -project TrailMeshTransportProbe.xcodeproj \
            -scheme TrailMeshTransportProbe \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/TrailMeshDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO
      - name: Package and validate the unsigned IPA
        shell: bash
        run: |
          app="$RUNNER_TEMP/TrailMeshDeviceDerivedData/Build/Products/Debug-iphoneos/TrailMeshTransportProbe.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = 'org.trailmesh.foregroundprobe.ios'
          xcrun lipo -archs "$app/TrailMeshTransportProbe" | grep -qw arm64

          widget="$app/PlugIns/TrailMeshSessionWidget.appex"
          test -d "$widget"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$widget/Info.plist")" = 'org.trailmesh.foregroundprobe.ios.sessionwidget'
          test "$(/usr/libexec/PlistBuddy -c 'Print NSExtension:NSExtensionPointIdentifier' "$widget/Info.plist")" = 'com.apple.widgetkit-extension'
          xcrun lipo -archs "$widget/TrailMeshSessionWidget" | grep -qw arm64

          package_dir="$RUNNER_TEMP/TrailMeshDevicePackage"
          output_dir="$RUNNER_TEMP/TrailMeshDeviceOutput"
          mkdir -p "$package_dir/Payload" "$output_dir"
          ditto "$app" "$package_dir/Payload/TrailMeshTransportProbe.app"
          (cd "$package_dir" && ditto -c -k --sequesterRsrc --keepParent Payload "$output_dir/TrailMeshTransportProbe-unsigned.ipa")
          unzip -t "$output_dir/TrailMeshTransportProbe-unsigned.ipa"
          (cd "$output_dir" && shasum -a 256 TrailMeshTransportProbe-unsigned.ipa > SHA256SUMS.txt)
      - name: Upload iPhone package for AltStore signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrailMeshTransportProbe-unsigned-iphoneos
          path: ${{ runner.temp }}/TrailMeshDeviceOutput/
          if-no-files-found: error
          retention-days: 7

  ios-product-repository:
    name: iOS product repository
    needs: change-detection
    if: needs.change-detection.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode with Swift 6.1
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          swift --version
      - name: Check the bundled vectors match the protocol contract
        run: |
          cmp ../../protocol/report-v1-vectors.json Tests/TrailMeshReportsTests/Fixtures/report-v1-vectors.json
          cmp ../../protocol/exchange-v1-vectors.json Tests/TrailMeshReportsTests/Fixtures/exchange-v1-vectors.json
          cmp ../../protocol/relevance-v1-vectors.json Tests/TrailMeshReportsTests/Fixtures/relevance-v1-vectors.json
          cmp ../../protocol/session-v1-profile.json Tests/TrailMeshReportsTests/Fixtures/session-v1-profile.json
          cmp ../../protocol/maps/region-v1-vectors.json Tests/TrailMeshMapsTests/Fixtures/region-v1-vectors.json
      - name: Test the product repository
        env:
          TRAILMESH_TEST_REPORT_OUTPUT: ${{ runner.temp }}/trailmesh-authored-report.json
          TRAILMESH_EXCHANGE_EXPORT: ${{ runner.temp }}/swift-exchange-frames.json
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/trailmesh-swift-test.log"
          grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' "$RUNNER_TEMP/trailmesh-swift-test.log"
      - name: Verify the authored report using the Python reference
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/trailmesh-python"
          "$RUNNER_TEMP/trailmesh-python/bin/python" -m pip install --disable-pip-version-check -r ../../tools/protocol/requirements.txt
          PYTHONPATH=../.. "$RUNNER_TEMP/trailmesh-python/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from tools.protocol.report import ValidatedReport, validate_report
          wire = Path(os.environ['RUNNER_TEMP'], 'trailmesh-authored-report.json').read_bytes()
          result = validate_report(wire, now_ms=1789647000000)
          if not isinstance(result, ValidatedReport):
              raise SystemExit(f'Python rejected Swift-authored test report: {result}')
          print('Python verified the Swift-authored public report')
          PY
          PYTHONPATH=../.. "$RUNNER_TEMP/trailmesh-python/bin/python" -m tools.transport.report_exchange --verify-native "$RUNNER_TEMP/swift-exchange-frames.json"

  ios-product-simulator:
    name: iOS product simulator tests
    needs: [change-detection, map-region-build, ios-routing-build]
    if: needs.change-detection.outputs.ios == 'true'
    runs-on: macos-15
    env:
      TRAILMESH_LOCAL_ROUTING_SDK: "1"
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the isolated routing framework
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TrailMesh-iOS-routing-sdk
          path: ${{ runner.temp }}/NativeRoutingSDK
      - name: Verify and unpack the signed routing framework
        shell: bash
        run: |
          (cd "$RUNNER_TEMP/NativeRoutingSDK" && shasum -a 256 -c TrailMeshValhalla.xcframework.zip.sha256)
          mkdir -p NativeRouting/Artifacts
          ditto -x -k "$RUNNER_TEMP/NativeRoutingSDK/TrailMeshValhalla.xcframework.zip" NativeRouting/Artifacts
          for slice in ios-arm64 ios-arm64_x86_64-simulator; do
            framework="NativeRouting/Artifacts/TrailMeshValhalla.xcframework/$slice/TrailMeshValhalla.framework"
            test -x "$framework/TrailMeshValhalla"
            codesign --verify --strict "$framework"
          done
      - name: Select Xcode with Swift 6.1
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Download verified regional test resources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TrailMesh-Rila-region
          path: ${{ runner.temp }}/Rila
      - name: Check vectors and select simulator
        id: simulator
        shell: bash
        run: |
          cmp ../../protocol/report-v1-vectors.json Tests/TrailMeshReportsTests/Fixtures/report-v1-vectors.json
          cmp ../../protocol/exchange-v1-vectors.json Tests/TrailMeshReportsTests/Fixtures/exchange-v1-vectors.json
          cmp ../../protocol/relevance-v1-vectors.json Tests/TrailMeshReportsTests/Fixtures/relevance-v1-vectors.json
          cmp ../../protocol/session-v1-profile.json Tests/TrailMeshReportsTests/Fixtures/session-v1-profile.json
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; m=sorted(((r,x["udid"]) for r,es in d.items() if "iOS" in r for x in es if x["name"] == "iPhone 16"),reverse=True); print(m[0][1] if m else "")')"
          test -n "$simulator_id"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Run report repository tests on iPhone simulator
        shell: bash
        run: |
          set -o pipefail
          export TEST_RUNNER_TRAILMESH_MAP_PACK="$RUNNER_TEMP/Rila/pack"
          export TEST_RUNNER_TRAILMESH_MAP_MANIFEST_SHA256="$(cat "$RUNNER_TEMP/Rila/manifest.sha256")"
          xcodebuild test -project Product/TrailMesh.xcodeproj -scheme TrailMesh \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/TrailMeshProductTests" \
            -resultBundlePath "$RUNNER_TEMP/TrailMeshMapTests.xcresult" \
            ARCHS=arm64 CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            | tee "$RUNNER_TEMP/trailmesh-simulator-test.log"
          grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' "$RUNNER_TEMP/trailmesh-simulator-test.log"
          grep -Eq 'testRealGraphColdOpenRouteAndSnapshot.*passed' "$RUNNER_TEMP/trailmesh-simulator-test.log"
      - name: Reopen the saved region after stopping the app process
        shell: bash
        run: |
          set -o pipefail
          export TEST_RUNNER_TRAILMESH_MAP_PACK="$RUNNER_TEMP/Rila/pack"
          export TEST_RUNNER_TRAILMESH_MAP_MANIFEST_SHA256="$(cat "$RUNNER_TEMP/Rila/manifest.sha256")"
          xcrun simctl terminate '${{ steps.simulator.outputs.id }}' org.trailmesh.ios || true
          xcodebuild test-without-building -project Product/TrailMesh.xcodeproj -scheme TrailMesh \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/TrailMeshProductTests" \
            -resultBundlePath "$RUNNER_TEMP/TrailMeshMapRestart.xcresult" \
            -only-testing:TrailMeshTests/NativeOfflineMapsTests/testRealGraphColdOpenRouteAndSnapshot \
            ARCHS=arm64 CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            | tee "$RUNNER_TEMP/trailmesh-map-restart.log"
          grep -Eq 'testRealGraphColdOpenRouteAndSnapshot.*passed' "$RUNNER_TEMP/trailmesh-map-restart.log"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/TrailMeshMapRestart.xcresult" --output-path "$RUNNER_TEMP/MapScreenshots"
          python3 - <<'PY'
          import os
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP'], 'MapScreenshots')
          assert any(b'Reopened existing verified app-private pack' in p.read_bytes() for p in evidence.rglob('*') if p.is_file()), 'Restart test must reuse the saved pack'
          assert any(p.suffix == '.png' for p in evidence.rglob('*')), 'Offline map screenshot is required'
          PY
      - name: Retain offline map screenshots and native test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrailMesh-iOS-offline-map-results
          path: |
            ${{ runner.temp }}/TrailMeshMapTests.xcresult
            ${{ runner.temp }}/TrailMeshMapRestart.xcresult
            ${{ runner.temp }}/MapScreenshots/
            apps/ios/Product/TrailMesh.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: error
          retention-days: 7

  ios-product-minimum:
    name: iOS 17.0 product compatibility
    needs: [change-detection, map-region-build, ios-routing-build]
    if: needs.change-detection.outputs.ios == 'true'
    runs-on: macos-15
    env:
      TRAILMESH_LOCAL_ROUTING_SDK: "1"
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the isolated routing framework
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TrailMesh-iOS-routing-sdk
          path: ${{ runner.temp }}/NativeRoutingSDK
      - name: Verify and unpack the signed routing framework
        shell: bash
        run: |
          (cd "$RUNNER_TEMP/NativeRoutingSDK" && shasum -a 256 -c TrailMeshValhalla.xcframework.zip.sha256)
          mkdir -p NativeRouting/Artifacts
          ditto -x -k "$RUNNER_TEMP/NativeRoutingSDK/TrailMeshValhalla.xcframework.zip" NativeRouting/Artifacts
          for slice in ios-arm64 ios-arm64_x86_64-simulator; do
            framework="NativeRouting/Artifacts/TrailMeshValhalla.xcframework/$slice/TrailMeshValhalla.framework"
            test -x "$framework/TrailMeshValhalla"
            codesign --verify --strict "$framework"
          done
      - name: Select Xcode with Swift 6.1
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Download verified regional test resources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TrailMesh-Rila-region
          path: ${{ runner.temp }}/Rila
      - name: Install the minimum supported iOS simulator runtime
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/TrailMeshIOS17"
          xcrun simctl list >/dev/null
          xcodebuild -downloadPlatform iOS -buildVersion 17.0 -exportPath "$RUNNER_TEMP/TrailMeshIOS17"
      - name: Create the minimum-version simulator
        id: simulator
        shell: bash
        run: |
          runtime_id="$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; r=json.load(sys.stdin)["runtimes"]; m=[x["identifier"] for x in r if x.get("version") == "17.0" and x.get("isAvailable")]; print(m[0] if m else "")')"
          test -n "$runtime_id"
          simulator_id="$(xcrun simctl create TrailMesh-iOS17 com.apple.CoreSimulator.SimDeviceType.iPhone-15 "$runtime_id")"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Run report repository tests on iOS 17.0
        shell: bash
        run: |
          set -o pipefail
          cmp ../../protocol/report-v1-vectors.json Tests/TrailMeshReportsTests/Fixtures/report-v1-vectors.json
          cmp ../../protocol/exchange-v1-vectors.json Tests/TrailMeshReportsTests/Fixtures/exchange-v1-vectors.json
          cmp ../../protocol/relevance-v1-vectors.json Tests/TrailMeshReportsTests/Fixtures/relevance-v1-vectors.json
          cmp ../../protocol/session-v1-profile.json Tests/TrailMeshReportsTests/Fixtures/session-v1-profile.json
          export TEST_RUNNER_TRAILMESH_MAP_PACK="$RUNNER_TEMP/Rila/pack"
          export TEST_RUNNER_TRAILMESH_MAP_MANIFEST_SHA256="$(cat "$RUNNER_TEMP/Rila/manifest.sha256")"
          xcodebuild test -project Product/TrailMesh.xcodeproj -scheme TrailMesh \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/TrailMeshProductMinimum" \
            ARCHS=arm64 CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            | tee "$RUNNER_TEMP/trailmesh-ios17-test.log"
          grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' "$RUNNER_TEMP/trailmesh-ios17-test.log"
          grep -Eq 'testRealGraphColdOpenRouteAndSnapshot.*passed' "$RUNNER_TEMP/trailmesh-ios17-test.log"

  ios-product-package:
    name: Unsigned iPhone product package
    needs: change-detection
    if: needs.change-detection.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode with Swift 6.1
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Build the distinct product app
        run: >-
          xcodebuild build -project Product/TrailMesh.xcodeproj -scheme TrailMesh
          -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/TrailMeshProductDevice" CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned product
        shell: bash
        run: |
          app="$RUNNER_TEMP/TrailMeshProductDevice/Build/Products/Debug-iphoneos/TrailMesh.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = 'org.trailmesh.ios'
          xcrun lipo -archs "$app/TrailMesh" | grep -qw arm64
          mkdir -p "$RUNNER_TEMP/TrailMeshProductPackage/Payload" "$RUNNER_TEMP/TrailMeshProductOutput"
          ditto "$app" "$RUNNER_TEMP/TrailMeshProductPackage/Payload/TrailMesh.app"
          (cd "$RUNNER_TEMP/TrailMeshProductPackage" && ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/TrailMeshProductOutput/TrailMeshProduct-unsigned.ipa")
          unzip -t "$RUNNER_TEMP/TrailMeshProductOutput/TrailMeshProduct-unsigned.ipa"
          (cd "$RUNNER_TEMP/TrailMeshProductOutput" && shasum -a 256 TrailMeshProduct-unsigned.ipa > SHA256SUMS.txt)
      - name: Upload unsigned product for signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrailMeshProduct-unsigned-iphoneos
          path: ${{ runner.temp }}/TrailMeshProductOutput/
          if-no-files-found: error
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
