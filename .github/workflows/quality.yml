name: Quality
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  iphone-screen-capture:
    runs-on: macos-26
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        capture: [screens, menus]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: TrailMesh-Rila-region
          path: ${{ runner.temp }}/Rila
          github-token: ${{ github.token }}
          run-id: 45074808825
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - name: Build iPhone app for simulator
        if: matrix.capture == 'screens'
        run: |
          xcodebuild build -project apps/ios/Product/TrailMesh.xcodeproj -scheme TrailMesh \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/TrailMeshCapture" \
            ARCHS=arm64 CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO -quiet
      - name: Run and capture native product
        env:
          CAPTURE_MODE: ${{ matrix.capture }}
        run: python3 tools/ci/capture_iphone_screens.py "$RUNNER_TEMP" "$CAPTURE_MODE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: TrailMesh-iPhone-UI-${{ matrix.capture }}
          path: ${{ runner.temp }}/TrailMeshScreens
          retention-days: 14
          if-no-files-found: error
