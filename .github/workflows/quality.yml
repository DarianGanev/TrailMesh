name: Quality

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check required project files
        shell: bash
        run: |
          test -s TrailMesh.md
          test -s README.md
          test -s .coderabbit.yaml
          ! find . -type f \( -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.mobileprovision' \) -print -quit | grep -q .
      - name: Check specification headings
        shell: bash
        run: |
          grep -q '^# TrailMesh' TrailMesh.md
          grep -q '## 8\. Mandatory feasibility experiments' TrailMesh.md
          grep -q '## 25\. Nine-month milestones' TrailMesh.md
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20
        with:
          globs: '**/*.md'

  protocol-fixture:
    name: Protocol fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate fixture JSON
        shell: bash
        run: python3 -m json.tool protocol/fixture-v1.json >/dev/null
      - name: Validate fixture contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          fixture = json.loads(Path('protocol/fixture-v1.json').read_text(encoding='utf-8'))
          required = {'fixtureVersion', 'status', 'purpose', 'nextSteps'}
          missing = required.difference(fixture)
          if missing:
              raise SystemExit(f'missing fixture fields: {sorted(missing)}')
          if fixture['fixtureVersion'] != 1:
              raise SystemExit('fixtureVersion must be 1')
          if fixture['status'] != 'scaffold':
              raise SystemExit('the scaffold fixture must remain explicitly marked scaffold until Issue #1 is complete')
          if not isinstance(fixture['nextSteps'], list) or not fixture['nextSteps']:
              raise SystemExit('nextSteps must be a non-empty list')
          PY

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
