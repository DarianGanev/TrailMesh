name: Quality

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  change-detection:
    name: Change detection
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify platform-relevant changes
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed_paths="apps/__run_all__"
          else
            changed_paths="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          fi

          android=false
          ios=false
          if grep -Eq '^(\.github/workflows/quality\.yml|apps/|probes/transport/android/|protocol/|tools/protocol/|tools/transport/|tools/ci/)' <<< "$changed_paths"; then
            android=true
          fi
          if grep -Eq '^(\.github/workflows/quality\.yml|apps/|probes/transport/ios/|protocol/|tools/protocol/|tools/transport/)' <<< "$changed_paths"; then
            ios=true
          fi

          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "Android checks: $android"
          echo "iOS checks: $ios"

  protocol-contracts:
    name: Protocol and transport contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install protocol tooling
        run: python -m pip install --disable-pip-version-check --requirement tools/protocol/requirements.txt
      - name: Validate fixture JSON
        run: python -m json.tool protocol/fixture-v1.json >/dev/null
      - name: Validate frozen fixture contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, '.')
          from tools.protocol.vector import parse_json_strict

          fixture = parse_json_strict(Path('protocol/fixture-v1.json').read_text(encoding='utf-8'))
          required = {
              'fixtureVersion', 'status', 'purpose', 'coreDomain', 'idDomain',
              'core', 'canonicalCore', 'canonicalCoreSha256', 'bundleId',
              'publicKey', 'signature',
          }
          missing = required.difference(fixture)
          if missing:
              raise SystemExit(f'missing fixture fields: {sorted(missing)}')
          if fixture['fixtureVersion'] != 1:
              raise SystemExit('fixtureVersion must be 1')
          if fixture['status'] != 'frozen':
              raise SystemExit('fixtureVersion 1 must remain explicitly frozen after Issue #1')
          PY
      - name: Run protocol admission and vector tests
        run: python -m unittest discover -s tools/protocol -p 'test_*.py'
      - name: Run bounded exchange contract tests
        run: python -m unittest discover -s tools/transport -p 'test_*.py'

  android-probe:
    name: Android transport probe
    needs: change-detection
    if: needs.change-detection.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: probes/transport/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Run Android unit tests and build the probe
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Upload Android test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrailMeshTransportProbe-android-debug
          path: probes/transport/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-product:
    name: Android product repository
    needs: change-detection
    if: needs.change-detection.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Verify shared vectors and pre-release schema fixtures exist
        run: |
          test -s ../../protocol/report-v1-vectors.json
          for version in 1 2 3; do
            test -s "app/schemas/org.trailmesh.app.persistence.ReportDatabase/$version.json"
          done
      - name: Test repository and build product and instrumentation APKs
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Require passing tests and unchanged Room schema exports
        run: |
          python ../../tools/ci/check_junit.py app/build/test-results/testDebugUnitTest
          git diff --exit-code -- app/schemas
          test -z "$(git status --porcelain -- app/schemas)"
      - name: Independently validate Android-authored signed report
        run: |
          python -m pip install --disable-pip-version-check -r ../../tools/protocol/requirements.txt
          PYTHONPATH=../.. python -c 'from pathlib import Path; from tools.protocol.report import validate_report, ValidatedReport; result=validate_report(Path("app/build/interop/android-authored.json").read_bytes(), now_ms=1789647000000); assert isinstance(result, ValidatedReport), result'
      - name: Upload Android product artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrailMeshProduct-android-debug
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            apps/android/app/build/test-results/testDebugUnitTest/
            apps/android/app/build/interop/android-authored.json
          if-no-files-found: error
          retention-days: 7

  android-product-devices:
    name: Android product API ${{ matrix.api }}
    needs: [change-detection, android-product]
    if: needs.change-detection.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, '37.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Android SDK tools supporting Android 17
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902' # Command-line Tools 22.0
          log-accepted-android-sdk-licenses: false
      - name: Expose pinned tools to the emulator action
        run: |
          pinned_tools="$ANDROID_HOME/cmdline-tools/22.0"
          runner_latest="$ANDROID_HOME/cmdline-tools/latest"
          test -x "$pinned_tools/bin/avdmanager"
          if [[ -e "$runner_latest" || -L "$runner_latest" ]]; then
            mv "$runner_latest" "$RUNNER_TEMP/android-preinstalled-cmdline-tools"
          fi
          ln -s "$pinned_tools" "$runner_latest"
          grep -F 'Pkg.Revision=22.0' "$runner_latest/source.properties"
      - name: Run real Android SQLite, migration, crypto, Keystore and restart tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          pre-emulator-launch-script: |
            grep -Fx 'target=android-${{ matrix.api }}' "$HOME/.android/avd/test.ini"
          script: |
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "$(printf '%s' '${{ matrix.api }}' | cut -d . -f 1)"
            cd apps/android && ./gradlew --no-daemon connectedDebugAndroidTest
            python tools/ci/check_junit.py apps/android/app/build/outputs/androidTest-results/connected
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb install -t -r apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class org.trailmesh.app.persistence.ProcessRestartInstrumentedTest -e phase store org.trailmesh.app.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/process-store.txt"
            cat "$RUNNER_TEMP/process-store.txt" && grep -Eq 'OK \(1 test\)' "$RUNNER_TEMP/process-store.txt"
            adb shell am force-stop org.trailmesh.app
            adb shell am instrument -w -r -e class org.trailmesh.app.persistence.ProcessRestartInstrumentedTest -e phase verify org.trailmesh.app.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/process-restart.txt"
            cat "$RUNNER_TEMP/process-restart.txt" && grep -Eq 'OK \(1 test\)' "$RUNNER_TEMP/process-restart.txt"
      - name: Upload device test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrailMeshProduct-android-api-${{ matrix.api }}-results
          path: |
            apps/android/app/build/outputs/androidTest-results/
            apps/android/app/build/reports/androidTests/
            ${{ runner.temp }}/process-restart.txt
            ${{ runner.temp }}/process-store.txt
          if-no-files-found: error
          retention-days: 7

  ios-probe:
    name: iOS transport probe
    needs: change-detection
    if: needs.change-detection.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: probes/transport/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; matches=sorted(((runtime, device["name"], device["udid"]) for runtime, entries in devices.items() if "iOS" in runtime for device in entries if device["name"] == "iPhone 16"), reverse=True); print(matches[0][2] if matches else "")')"
          if [[ -z "$simulator_id" ]]; then
            echo "No available iPhone 16 simulator found" >&2
            exit 1
          fi
          xcrun simctl list devices available | grep -F "$simulator_id"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Run iOS frame and session tests
        run: >-
          xcodebuild test
          -project TrailMeshTransportProbe.xcodeproj
          -scheme TrailMeshTransportProbe
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}"
          -derivedDataPath "$RUNNER_TEMP/TrailMeshDerivedData"
          ARCHS=arm64
          CODE_SIGNING_ALLOWED=NO

  ios-device-package:
    name: Unsigned iPhone probe package
    needs: change-detection
    if: needs.change-detection.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: probes/transport/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build for a physical iPhone without repository signing secrets
        shell: bash
        run: |
          xcodebuild build \
            -project TrailMeshTransportProbe.xcodeproj \
            -scheme TrailMeshTransportProbe \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/TrailMeshDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO
      - name: Package and validate the unsigned IPA
        shell: bash
        run: |
          app="$RUNNER_TEMP/TrailMeshDeviceDerivedData/Build/Products/Debug-iphoneos/TrailMeshTransportProbe.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = 'org.trailmesh.foregroundprobe.ios'
          xcrun lipo -archs "$app/TrailMeshTransportProbe" | grep -qw arm64

          widget="$app/PlugIns/TrailMeshSessionWidget.appex"
          test -d "$widget"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$widget/Info.plist")" = 'org.trailmesh.foregroundprobe.ios.sessionwidget'
          test "$(/usr/libexec/PlistBuddy -c 'Print NSExtension:NSExtensionPointIdentifier' "$widget/Info.plist")" = 'com.apple.widgetkit-extension'
          xcrun lipo -archs "$widget/TrailMeshSessionWidget" | grep -qw arm64

          package_dir="$RUNNER_TEMP/TrailMeshDevicePackage"
          output_dir="$RUNNER_TEMP/TrailMeshDeviceOutput"
          mkdir -p "$package_dir/Payload" "$output_dir"
          ditto "$app" "$package_dir/Payload/TrailMeshTransportProbe.app"
          (cd "$package_dir" && ditto -c -k --sequesterRsrc --keepParent Payload "$output_dir/TrailMeshTransportProbe-unsigned.ipa")
          unzip -t "$output_dir/TrailMeshTransportProbe-unsigned.ipa"
          (cd "$output_dir" && shasum -a 256 TrailMeshTransportProbe-unsigned.ipa > SHA256SUMS.txt)
      - name: Upload iPhone package for AltStore signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrailMeshTransportProbe-unsigned-iphoneos
          path: ${{ runner.temp }}/TrailMeshDeviceOutput/
          if-no-files-found: error
          retention-days: 7

  ios-product-repository:
    name: iOS product repository
    needs: change-detection
    if: needs.change-detection.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode with Swift 6.1
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          swift --version
      - name: Check the bundled vectors match the protocol contract
        run: cmp ../../protocol/report-v1-vectors.json Tests/TrailMeshReportsTests/Fixtures/report-v1-vectors.json
      - name: Test the product repository
        env:
          TRAILMESH_TEST_REPORT_OUTPUT: ${{ runner.temp }}/trailmesh-authored-report.json
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/trailmesh-swift-test.log"
          grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' "$RUNNER_TEMP/trailmesh-swift-test.log"
      - name: Verify the authored report using the Python reference
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/trailmesh-python"
          "$RUNNER_TEMP/trailmesh-python/bin/python" -m pip install --disable-pip-version-check -r ../../tools/protocol/requirements.txt
          PYTHONPATH=../.. "$RUNNER_TEMP/trailmesh-python/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from tools.protocol.report import ValidatedReport, validate_report
          wire = Path(os.environ['RUNNER_TEMP'], 'trailmesh-authored-report.json').read_bytes()
          result = validate_report(wire, now_ms=1789647000000)
          if not isinstance(result, ValidatedReport):
              raise SystemExit(f'Python rejected Swift-authored test report: {result}')
          print('Python verified the Swift-authored public report')
          PY

  ios-product-simulator:
    name: iOS product simulator tests
    needs: change-detection
    if: needs.change-detection.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode with Swift 6.1
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Check vectors and select simulator
        id: simulator
        shell: bash
        run: |
          cmp ../../protocol/report-v1-vectors.json Tests/TrailMeshReportsTests/Fixtures/report-v1-vectors.json
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; m=sorted(((r,x["udid"]) for r,es in d.items() if "iOS" in r for x in es if x["name"] == "iPhone 16"),reverse=True); print(m[0][1] if m else "")')"
          test -n "$simulator_id"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Run report repository tests on iPhone simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test -project Product/TrailMesh.xcodeproj -scheme TrailMesh \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/TrailMeshProductTests" \
            ARCHS=arm64 CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            | tee "$RUNNER_TEMP/trailmesh-simulator-test.log"
          grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' "$RUNNER_TEMP/trailmesh-simulator-test.log"

  ios-product-minimum:
    name: iOS 16.1 product compatibility
    needs: change-detection
    if: needs.change-detection.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode with Swift 6.1
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install the minimum supported iOS simulator runtime
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/TrailMeshIOS16"
          xcrun simctl list >/dev/null
          xcodebuild -downloadPlatform iOS -buildVersion 16.1 -exportPath "$RUNNER_TEMP/TrailMeshIOS16"
      - name: Create the minimum-version simulator
        id: simulator
        shell: bash
        run: |
          runtime_id="$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; r=json.load(sys.stdin)["runtimes"]; m=[x["identifier"] for x in r if x.get("version") == "16.1" and x.get("isAvailable")]; print(m[0] if m else "")')"
          test -n "$runtime_id"
          simulator_id="$(xcrun simctl create TrailMesh-iOS16 com.apple.CoreSimulator.SimDeviceType.iPhone-14 "$runtime_id")"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Run report repository tests on iOS 16.1
        shell: bash
        run: |
          set -o pipefail
          cmp ../../protocol/report-v1-vectors.json Tests/TrailMeshReportsTests/Fixtures/report-v1-vectors.json
          xcodebuild test -project Product/TrailMesh.xcodeproj -scheme TrailMesh \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/TrailMeshProductMinimum" \
            ARCHS=arm64 CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            | tee "$RUNNER_TEMP/trailmesh-ios16-test.log"
          grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' "$RUNNER_TEMP/trailmesh-ios16-test.log"

  ios-product-package:
    name: Unsigned iPhone product package
    needs: change-detection
    if: needs.change-detection.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode with Swift 6.1
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Build the distinct product app
        run: >-
          xcodebuild build -project Product/TrailMesh.xcodeproj -scheme TrailMesh
          -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/TrailMeshProductDevice" CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned product
        shell: bash
        run: |
          app="$RUNNER_TEMP/TrailMeshProductDevice/Build/Products/Debug-iphoneos/TrailMesh.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = 'org.trailmesh.ios'
          xcrun lipo -archs "$app/TrailMesh" | grep -qw arm64
          mkdir -p "$RUNNER_TEMP/TrailMeshProductPackage/Payload" "$RUNNER_TEMP/TrailMeshProductOutput"
          ditto "$app" "$RUNNER_TEMP/TrailMeshProductPackage/Payload/TrailMesh.app"
          (cd "$RUNNER_TEMP/TrailMeshProductPackage" && ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/TrailMeshProductOutput/TrailMeshProduct-unsigned.ipa")
          unzip -t "$RUNNER_TEMP/TrailMeshProductOutput/TrailMeshProduct-unsigned.ipa"
          (cd "$RUNNER_TEMP/TrailMeshProductOutput" && shasum -a 256 TrailMeshProduct-unsigned.ipa > SHA256SUMS.txt)
      - name: Upload unsigned product for signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrailMeshProduct-unsigned-iphoneos
          path: ${{ runner.temp }}/TrailMeshProductOutput/
          if-no-files-found: error
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
