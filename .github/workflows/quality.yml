name: Quality

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check required project files
        shell: bash
        run: |
          test -s TrailMesh.md
          test -s README.md
          test -s .coderabbit.yaml
          ! find . -type f \( -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.mobileprovision' \) -print -quit | grep -q .
      - name: Check specification headings
        shell: bash
        run: |
          grep -q '^# TrailMesh' TrailMesh.md
          grep -q '## 8\. Mandatory feasibility experiments' TrailMesh.md
          grep -q '## 25\. Nine-month milestones' TrailMesh.md
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'

  protocol-fixture:
    name: Protocol fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate fixture JSON
        shell: bash
        run: python3 -m json.tool protocol/fixture-v1.json >/dev/null
      - name: Validate fixture contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          fixture = json.loads(Path('protocol/fixture-v1.json').read_text(encoding='utf-8'))
          required = {
              'fixtureVersion', 'status', 'purpose', 'coreDomain', 'idDomain',
              'core', 'canonicalCore', 'canonicalCoreSha256', 'bundleId',
              'publicKey', 'signature',
          }
          missing = required.difference(fixture)
          if missing:
              raise SystemExit(f'missing fixture fields: {sorted(missing)}')
          if fixture['fixtureVersion'] != 1:
              raise SystemExit('fixtureVersion must be 1')
          if fixture['status'] != 'frozen':
              raise SystemExit('fixtureVersion 1 must remain explicitly frozen after Issue #1')
          PY

  protocol-tests:
    name: Protocol vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protocol tooling
        run: python3 -m pip install --disable-pip-version-check --requirement tools/protocol/requirements.txt
      - name: Run protocol vector tests
        run: python3 -m unittest tools.protocol.test_vector

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
