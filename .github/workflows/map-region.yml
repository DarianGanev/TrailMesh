name: Rila offline region
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install bounded regional tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool=1.16.0-1build1 tilemaker=2.4.0-1build4
          python -m pip install osmium==4.1.1 pillow==11.3.0
      - name: Validate contract tests
        run: python -m unittest discover -s tools/maps -p 'test_*.py'
      - name: Build frozen OSM region
        run: bash tools/maps/prepare_rila.sh "$RUNNER_TEMP/rila"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrailMesh-Rila-region
          path: |
            ${{ runner.temp }}/rila/pack/
            ${{ runner.temp }}/rila/release-assets/
            ${{ runner.temp }}/rila/build-evidence.json
            ${{ runner.temp }}/rila/route-smoke.json
            ${{ runner.temp }}/rila/smoke.json
            ${{ runner.temp }}/rila/terrain-evidence.json
            ${{ runner.temp }}/rila/manifest.sha256
            ${{ runner.temp }}/rila/map-metadata.json
          retention-days: 14
          if-no-files-found: error
